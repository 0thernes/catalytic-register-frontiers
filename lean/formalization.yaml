limitations: "Uniform proof of D_{3,Q}^{pass}(t) = 2t-3 for all t >= 4, general non-prime extension fields F_{p^e} (e >= 2), r=4 beyond log_7(4), and Boyar-Find / Mul_5 remain open (Tier-4). T3a-T3d exclude explicitly factored bad prime denominators."
axiom_allowlist:
  - propext
  - Classical.choice
  - Quot.sound
kernels_verified:
  - lean (v4.35.0)
  - leanchecker
  - leanchecker-paranoid
  - con-leche --verified
  - con-ron --verified
  - nanoda_bin (0.4.19)
theorems:
  - id: T1
    name: Catalytic.Solution.t1_digit_sum_dichotomy
    module: Catalytic.DigitSumDichotomy
    summary: "Exact base-p digit-sum IFF characterization of RP^{pass}_{F_p}(2, t) for all primes p and t >= 1."
  - id: T1a
    name: Catalytic.Solution.t1a_two_access_frobenius_collapse
    module: Catalytic.DigitSumDichotomy
    summary: "Unbounded-degree 2-access Frobenius collapse x^(p^m) in RP^{pass}_{F_p}(2, 2) for all primes p."
  - id: T1b
    name: Catalytic.Solution.t1b_f2_saturation
    module: Catalytic.DigitSumDichotomy
    summary: "Exact F_2 two-register saturation: x^3 not in RP^{pass}_{F_2}(2, t) for any t."
  - id: T1c
    name: Catalytic.Solution.t1c_impossibility_threshold
    module: Catalytic.DigitSumDichotomy
    summary: "Impossibility threshold: s_p(d) >= p implies x^d not in RP^{pass}_{F_p}(2, t) for any t."
  - id: T1d
    name: Catalytic.Solution.t1d_vinciguerra_recovery
    module: Catalytic.DigitSumDichotomy
    summary: "Large-characteristic recovery of Vinciguerra Theorem 3.5 (2 <= d < p -> x^d in RP(2,t) iff d+1 <= t)."
  - id: T1e
    name: Catalytic.Solution.t1e_extension_field_separation
    module: Catalytic.ExtensionFieldSeparation
    summary: "Exact sharp F_4 separation: x^5 in RP(2,3) and not RP(2,2), x^3 in RP(2,4) and not RP(2,3), and x^7 not in RP(2,t) for all t."
  - id: T1s
    name: Catalytic.Solution.t1s_pass2_ring_soundness
    module: Catalytic.Pass2Soundness
    summary: "Literal CRing soundness bridge: direct ring execution of every Pass2Prog agrees identically with symbolic Pass2Prog.exec over every char-p commutative ring R."
  - id: T1es
    name: Catalytic.Solution.t1es_pass2_gf4_soundness
    module: Catalytic.Pass2Soundness
    summary: "Literal GF4-algebra soundness bridge: direct algebra execution of every Pass2GF4Prog agrees identically with symbolic Pass2GF4Prog.exec over every commutative GF4-algebra (R, phi)."
  - id: T2
    name: Catalytic.Solution.t2_bilinear_frobenius_collapse
    module: Catalytic.BilinearFrobenius
    summary: "Strictly bilinear passive-output 2-access computation of x^(2^k) over any char-2 commutative ring."
  - id: T2b
    name: Catalytic.Solution.t2b_distinct_operand_frobenius
    module: Catalytic.BilinearFrobenius
    summary: "Strictly distinct-operand 2-access Frobenius collapse for x^(2^k) on k+2 registers (zero self-squares R_a * R_a)."
  - id: T3a
    name: Catalytic.Solution.t3a_three_reg_5call_x7
    module: Catalytic.ThreeRegisterBreakthrough
    summary: "Explicit 3-register passive program for x^7 in 5 input accesses (valid for char != 2, 3)."
  - id: T3b
    name: Catalytic.Solution.t3b_three_reg_6call_x9
    module: Catalytic.ThreeRegisterBreakthrough
    summary: "Explicit 3-register passive program for x^9 in 6 input accesses (valid for char not in {2,3,5,17})."
  - id: T3c
    name: Catalytic.Solution.t3c_three_reg_7call_x11
    module: Catalytic.ThreeRegisterBreakthrough
    summary: "Explicit 3-register passive program for x^11 in 7 input accesses over Q and good prime fields."
  - id: T3d
    name: Catalytic.Solution.t3d_three_reg_8call_x13
    module: Catalytic.ThreeRegisterBreakthrough
    summary: "Explicit 3-register passive program for x^13 in 8 input accesses achieving optimal log_13(8) = 0.810714."
  - id: T3e
    name: Catalytic.Solution.t3e_exponent_chain
    module: Catalytic.ThreeRegisterBreakthrough
    summary: "Exact Nat power inequalities certifying log_13(8) < log_11(7) < log_9(6) < log_7(5) < log_5(4) and < log_15(9)."
  - id: T3f
    name: Catalytic.Solution.t3f_global_integer_optimality
    module: Catalytic.ThreeRegisterBreakthrough
    summary: "Unconditional global integer optimality of t = 8 for ALL t >= 4 (t != 8) via single rational separator 30/37."
  - id: T3g
    name: Catalytic.Solution.t3g_three_reg_9call_x15
    module: Catalytic.ThreeRegisterBreakthrough
    summary: "Explicit 3-register passive program for x^15 in 9 input accesses (post-minimum ascent point log_15(9) = 0.811368)."
  - id: T3h
    name: Catalytic.Solution.t3h_four_reg_powering
    module: Catalytic.FourRegisterPowering
    summary: "Complete 4-register passive powering for ALL N >= 1 via non-passive 3-register composition + Cook-Mertz finite differences: < (104/3)*N^{log_13 8} (prog8_x13) and < (70/3)*N^{log_7 5} (prog5_x7)."
  - id: T3i
    name: Catalytic.Solution.t3i_streaming_frequency_moment
    module: Catalytic.FourRegisterPowering
    summary: "Pointwise product-ring (Fin n -> R) instantiation of T3h certifying algebraic catalytic streaming frequency moments F_D(f) = sum_{i<n} f_i^D in < (104/3)*D^{log_13 8} passes."
  - id: T4
    name: Catalytic.Solution.t4_balanced_multilinear_product
    module: Catalytic.BalancedProduct
    summary: "Balanced zero-workspace bilinear catalytic d-fold product (d=2^k) in k+2 registers and (7d^2-4)/3 ops."
  - id: NONVAC
    name: Catalytic.NonVacuity.nonvac_all_hypotheses
    module: Catalytic.NonVacuity
    summary: "Concrete non-trivial ring/prime/evaluation witnesses proving zero vacuous hypotheses across T1–T4."
