project:
  name: "Prime-Field Digit-Sum Dichotomy and Improved Three-Register Powering Exponents in Passive Catalytic Register Programs"
  description: >-
    Zero-Mathlib Lean 4.35.0 formalization of new results extending Vinciguerra's
    operator analysis of passive-output catalytic register programs
    (arXiv:2609.18692); no question posed in that paper is resolved. The 17
    compared theorems prove: (1) under formal-polynomial cleanliness with program
    constants in F_p, a base-p digit-sum characterisation f in RP^{pass}_{F_p}(2, t)
    iff s_p(d) <= min(p - 1, t - 1) for all d >= 2 with alpha_d != 0, with
    corollaries x^{p^m} in 2 accesses (the characteristic-0 lower bounds do not
    extend to characteristic p), no program yielding the formal polynomial x^3 with
    F_2 constants for any t (as a function on F_2, x^3 = x), no program yielding
    x^d when s_p(d) >= p, a large-characteristic analogue of Theorem 3.5 for d < p,
    and a soundness bridge from formal cleanliness to execution over every
    characteristic-p commutative ring; (2) 2-access product-only programs for
    x^{2^k} in k + 1 registers and 4k - 2 bilinear ops over any characteristic-2
    commutative ring; (3) explicit 3-register Pascal-row shear loops computing x^7,
    x^9, x^11, x^13, and x^15 in 5..9 accesses, the integer fact that t = 8
    minimises log_{2t-3} t over integers t >= 4 (not an optimality theorem for
    register programs; no upper bound is proved), 4-register passive powering for
    every N >= 1 in < (104/3) * 8^ell accesses over rings where D_8, 12! and
    (ell + 1)! are invertible, and its coordinatewise form over R^n; and (4) a
    balanced zero-workspace multilinear product x_0...x_{2^k - 1} (the classical
    four-step clean-product recursion; cf. Ben-Or and Cleve, SIAM J. Comput. 21(1),
    1992, doi:10.1137/0221006) with every operation constrained by CatOp.usesOnly
    to at most k + 2 designated registers and exact primitive op count
    (7 * (2^k)^2 - 4) / 3.
  authors:
    - name: "Alexander S. Donahue"
      orcid: "0009-0006-8168-9648"
      email: "0_0@0thernes.art"
      affiliation: "Independent Researcher, Spokane, WA, USA"
