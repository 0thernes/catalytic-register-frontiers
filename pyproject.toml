# SPDX-License-Identifier: Apache-2.0
[project]
name = "catalytic-register-frontiers"
version = "1.1.0"
description = "Zero-Mathlib Lean 4.35 formalization and exact-arithmetic verification of prime-field digit-sum dichotomy and improved 3-register powering exponents in passive catalytic register programs."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [
  { name = "Alexander S. Donahue", email = "0_0@0thernes.art" },
]
keywords = [
  "catalytic-computing",
  "register-programs",
  "finite-fields",
  "lean4",
  "formal-verification",
]
dependencies = [
  "matplotlib==3.11.2",
  "numpy==2.5.5",
  "scipy==1.18.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.2.0",
  "hypothesis==6.170.17",
  "ruff==0.17.6",
  "mypy==2.4.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/test_all.py" = ["E402"]

[tool.mypy]
python_version = "3.13"
explicit_package_bases = true
namespace_packages = true
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
