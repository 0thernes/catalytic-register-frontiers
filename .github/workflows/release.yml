# SPDX-License-Identifier: Apache-2.0
# Runs after a v* tag is pushed. Publishes release notes from CHANGELOG.md,
# frozen paper/arXiv artifacts, SHA256SUMS, and Sigstore SLSA build provenance attestations.
# Never gates a commit or push (Build Standard R1, R3).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version consistency
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(tr -d '[:space:]' < VERSION 2>/dev/null || true)"
          [ "$file" = "$tag" ] || echo "::warning::VERSION ($file) does not match tag ($tag)"
          grep -Eq "^## \[?$tag\]?" CHANGELOG.md || echo "::warning::CHANGELOG.md has no section for $tag"

      - name: Package source archive and verify dist artifacts
        run: |
          mkdir -p dist
          name="${GITHUB_REPOSITORY#*/}"
          git archive --format=tar.gz --prefix="$name-$GITHUB_REF_NAME/" -o "dist/$name-$GITHUB_REF_NAME-source.tar.gz" "$GITHUB_REF_NAME"
          git archive --format=zip --prefix="$name-$GITHUB_REF_NAME/" -o "dist/$name-$GITHUB_REF_NAME-source.zip" "$GITHUB_REF_NAME"
          cp results/lean_axioms.txt dist/lean_axioms.txt
          cp results/six_kernel_audit.txt dist/six_kernel_audit.txt
          cp sbom.cdx.json dist/sbom.cdx.json
          cp MANIFEST.sha256 dist/MANIFEST.sha256
          cp provenance/MANIFEST.sha256.tsr dist/MANIFEST.sha256.tsr
          cp provenance/MANIFEST.sha256.ots dist/MANIFEST.sha256.ots
          cp provenance/TIMESTAMP_AUDIT.txt dist/TIMESTAMP_AUDIT.txt

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS' -printf '%f\n' | sort > ../artifact-list.txt
          xargs sha256sum < ../artifact-list.txt > ../SHA256SUMS
          mv ../SHA256SUMS SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance (Sigstore SLSA)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"

      - name: Extract release notes from CHANGELOG.md
        run: |
          tag="${GITHUB_REF_NAME#v}"
          awk -v v="$tag" '$0 ~ "^## \\[?" v "\\]?" {f=1; next} f && /^## / {exit} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release $GITHUB_REF_NAME" > notes.md
          {
            echo
            echo "Verify: \`sha256sum -c SHA256SUMS\` and \`gh attestation verify <file> --repo $GITHUB_REPOSITORY\`."
          } >> notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
