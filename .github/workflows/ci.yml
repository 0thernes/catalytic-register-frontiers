# SPDX-License-Identifier: Apache-2.0
# Informational CI: reports results on every push, never blocks commits (Build Standard R1, R3).
name: Verify Lean 4.35, Exact Arithmetic, Linters, and AMS-LaTeX

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  lean-and-paper-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install elan and pinned Lean 4.35.0
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          cd lean && "$HOME/.elan/bin/lean" --version

      - name: Forbidden-token scan across lean/**/*.lean
        run: |
          if grep -rnE --exclude-dir=.lake --exclude=PalomarChallenge.lean '\b(sorry|admit|native_decide|implemented_by|unsafe)\b|^\s*(private\s+|protected\s+|local\s+|scoped\s+|noncomputable\s+)*axiom\b|@\[extern' lean/; then
            echo "FORBIDDEN TOKEN FOUND IN PROOF MODULES!" >&2
            exit 1
          fi
          if grep -rnE '\b(admit|native_decide|implemented_by|unsafe)\b|^\s*(private\s+|protected\s+|local\s+|scoped\s+|noncomputable\s+)*axiom\b|@\[extern|^\s*(public\s+|meta\s+)?import\b' lean/PalomarChallenge.lean; then
            echo "FORBIDDEN TOKEN OR IMPORT IN PALOMAR CHALLENGE STUB!" >&2
            exit 1
          fi
          if grep -rnE '\bPalomarChallenge\b' lean/Catalytic/ lean/Challenge.lean lean/Solution.lean lean/PalomarSolution.lean lean/VerifyAxioms.lean; then
            echo "PROOF MODULE MUST NEVER IMPORT PalomarChallenge!" >&2
            exit 1
          fi
          echo "Forbidden-token scan clean (0 matches in all proof/solution modules)."

      - name: Build Lean 4.35 proofs, regenerate axioms, and replay external kernels
        run: |
          cd lean
          lake build
          lake env lean VerifyAxioms.lean | tee /tmp/axioms.txt
          test -s /tmp/axioms.txt
          diff -u ../results/lean_axioms.txt /tmp/axioms.txt
          if grep -qE 'sorryAx|_native|Lean\.ofReduceBool|Lean\.trustCompiler' /tmp/axioms.txt; then
            echo "UNPERMITTED AXIOM DETECTED!" >&2
            exit 1
          fi
          python3 - /tmp/axioms.txt <<'PYEOF'
          import pathlib, re, sys
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          lines = [ln.strip() for ln in pathlib.Path(sys.argv[1]).read_text(encoding="utf-8").splitlines() if ln.strip()]
          assert len(lines) == 22, f"Expected 22 audited axiom lines, got {len(lines)}"
          for ln in lines:
              if ln.endswith("does not depend on any axioms"):
                  continue
              m = re.match(r"^'[^']+' depends on axioms: \[([^\]]+)\]$", ln)
              assert m, f"Unrecognized axiom line: {ln}"
              extra = {tok.strip() for tok in m.group(1).split(",") if tok.strip()} - allowed
              assert not extra, f"Disallowed axioms {extra} in: {ln}"
          print(f"Strict 3-axiom allowlist verified on {len(lines)}/22 declarations.")
          PYEOF
          lake env leanchecker --fresh Solution
          lake env leanchecker-paranoid Solution
          lake env leanexport Solution -- Catalytic.Solution.prove_all_catalytic_theorems Catalytic.NonVacuity.nonvac_all_hypotheses > /tmp/catalytic_solution.ndjson
          lake env con-leche --verified /tmp/catalytic_solution.ndjson
          lake env con-ron --verified /tmp/catalytic_solution.ndjson
          lake check --paranoid

      - name: Setup Python 3.13 and run exact verification suite + pytest + LRAT verifier
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt
          CADICAL_PATH="$(cd lean && lake env which cadical 2>/dev/null || true)"
          if [ -z "$CADICAL_PATH" ]; then
            CADICAL_PATH="$(dirname "$(which lean)")/../toolchains/leanprover--lean4---v4.35.0/bin/cadical"
          fi
          if [ -x "$CADICAL_PATH" ]; then
            export CADICAL_BIN="$CADICAL_PATH"
            echo "CADICAL_BIN=$CADICAL_PATH" >> "$GITHUB_ENV"
          fi
          python scripts/verify_lrat.py
          python scripts/check_reuse.py
          pytest -v tests/test_all.py

      - name: Report-only static analysis (ruff) and strict type check (mypy)
        continue-on-error: true
        run: |
          ruff check experiments scripts tests
          mypy experiments scripts tests

      - name: Report-only security & citation hygiene audit
        continue-on-error: true
        run: |
          python scripts/check_citations.py --offline
          grep -rnE 'AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----|ghp_[A-Za-z0-9]{36}' . --exclude-dir=.git && exit 1 || echo "Secret scan clean"

      - name: Verify SHA-256 provenance manifest and DigiCert RFC 3161 timestamp
        run: |
          sha256sum -c MANIFEST.sha256
          if [ -f /etc/ssl/certs/ca-certificates.crt ]; then
            openssl ts -verify -data MANIFEST.sha256 -in provenance/MANIFEST.sha256.tsr -CAfile /etc/ssl/certs/ca-certificates.crt
          else
            openssl ts -verify -data MANIFEST.sha256 -in provenance/MANIFEST.sha256.tsr -CApath /etc/ssl/certs
          fi

      - name: Generate vector figures and compile AMS-LaTeX manuscript with Tectonic
        run: |
          python scripts/make_figures.py
          (cd /tmp && curl --proto '=https' --tlsv1.2 -fsSL https://drop-sh.fullyjustified.net | sh)
          mkdir -p paper/build
          (cd paper && /tmp/tectonic -X compile main.tex --outdir build --keep-intermediates)

      - name: Attest axiom report and frozen white paper (Sigstore SLSA)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            results/lean_axioms.txt
            results/six_kernel_audit.txt
            dist/Donahue_2026_catalytic_register_frontiers.pdf

  cross-platform-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install elan and pinned Lean 4.35.0 (provides cadical.exe)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://raw.githubusercontent.com/leanprover/elan/master/elan-init.ps1 -OutFile "$env:TEMP\elan-init.ps1"
          & "$env:TEMP\elan-init.ps1" -NoPrompt $true -DefaultToolchain none
          "$env:USERPROFILE\.elan\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "$env:USERPROFILE\.elan\toolchains\leanprover--lean4---v4.35.0\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Set-Location lean
          & "$env:USERPROFILE\.elan\bin\lean.exe" --version
      - name: Setup Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Run LRAT check, pytest, and Build Standard / Pipeline audits on Windows
        shell: pwsh
        run: |
          $env:CADICAL_BIN = "$env:USERPROFILE\.elan\toolchains\leanprover--lean4---v4.35.0\bin\cadical.exe"
          python -m pip install -r requirements.lock.txt
          python scripts/verify_lrat.py
          python scripts/check_reuse.py
          pytest -v tests/test_all.py
          pwsh -NoProfile -File scripts/Audit-Repo.ps1 -Path .
          python scripts/pipeline-audit.py
